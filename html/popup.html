<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hide Me Chat</title>
		<link rel="stylesheet" href="../css/ui.css" />
		<script src="../js/shared/icons.js" defer></script>
		<script src="../js/shared/password.js" defer></script>
		<script src="../js/shared/storage.js" defer></script>
		<script src="../js/popup/utilities.js" defer></script>
		<script src="../js/popup/mainPopup.js" defer></script>
	</head>
	<body class="popup">
		<div id="hc-gate" class="gate" hidden>
			<div class="gate-card">
				<span class="lock-badge" data-icon="lock"></span>
				<h1>Hide Me Chat is locked</h1>
				<p class="hint">Enter your password to see your chats.</p>
				<form id="hc-gate-form">
					<input id="hc-gate-password" class="field" type="password" placeholder="Password" autocomplete="current-password" maxlength="126" />
					<button class="button primary" type="submit">Unlock</button>
					<p id="hc-gate-message" class="message error" role="status"></p>
				</form>
			</div>
		</div>

		<header class="topbar">
			<img class="logo" src="../assets/hidechat_icon48.png" alt="" />
			<div class="title">
				<h1>Hide Me Chat</h1>
				<p class="subtle" id="version"></p>
			</div>
			<button id="toggle-theme" class="icon-button" type="button" title="Switch theme" aria-label="Switch theme" data-icon="moon"></button>
			<a href="./setting.html" class="icon-button" title="Settings" aria-label="Settings" data-icon="settings"></a>
		</header>

		<p id="page-health" class="notice" role="status" hidden></p>

		<main class="card">
			<div class="card-head">
				<h2>Your chats<span id="chatCount" class="count">0</span></h2>
				<label class="switch" title="Show hidden chats on this page for now">
					<input type="checkbox" id="toggle-hiddenall" disabled />
					<span class="track"></span>
					Show hidden
				</label>
			</div>
			<ul id="hiddenContainer" class="chat-list"></ul>
			<div id="empty-state" class="empty" hidden>
				<span data-icon="chat"></span>
				<p>No chats here yet.</p>
				<p>Right-click a chat in Messenger and choose <strong>Hide Me Chat</strong> to hide, pin, obfuscate or lock it.</p>
			</div>
		</main>
	</body>
</html>
